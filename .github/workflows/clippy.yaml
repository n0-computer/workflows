# clippy with all features, no default features and default features.
# The argument inputs are word-split, so pass plain cargo flags only.

name: clippy

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON.
        type: string
        default: '"ubuntu-latest"'
      toolchain:
        type: string
        default: stable
      all-features-args:
        type: string
        default: "--workspace --all-features --all-targets --bins --tests --benches"
      no-default-features-args:
        type: string
        default: "--workspace --no-default-features --lib --bins --tests"
      default-features-args:
        type: string
        default: "--workspace --all-targets"

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  clippy:
    timeout-minutes: 30
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - uses: $/.github/workflows/sccache-probe
      - name: clippy check (all features)
        env:
          ARGS: ${{ inputs.all-features-args }}
        run: |
          read -ra args <<< "$ARGS"
          cargo clippy --locked "${args[@]}"
      - name: clippy check (no default features)
        env:
          ARGS: ${{ inputs.no-default-features-args }}
        run: |
          read -ra args <<< "$ARGS"
          cargo clippy --locked "${args[@]}"
      - name: clippy check (default features)
        env:
          ARGS: ${{ inputs.default-features-args }}
        run: |
          read -ra args <<< "$ARGS"
          cargo clippy --locked "${args[@]}"
