# Checks the PR title is a conventional commit. Call it from a workflow
# triggered on pull_request (opened, edited, synchronize).

name: Commits

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-for-cc:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: check-for-cc
        uses: agenthunt/conventional-commit-checker-action@f1823f632e95a64547566dcd2c7da920e67117ad # v2.0.1
        with:
          pr-title-regex: "^(.+)(?:(([^)s]+)))?!?: (.+)"
