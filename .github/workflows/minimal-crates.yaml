# Check the minimally allowed crate versions build
#
# Generally this is included form the main CI job and re-uses the
# triggers used there.

name: Min Crates

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: min-crates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  minimal-crates:
    # Ephemeral only: this job resolves versions the lockfile has never seen
    # and runs their build scripts.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: [ubuntu-latest, macOS-arm-latest]
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
            release-os: linux
            release-arch: amd64
            runner: "blacksmith-8vcpu-ubuntu-2404"
          - name: macOS-arm-latest
            os: macOS-latest
            release-os: darwin
            release-arch: aarch64
            runner: "blacksmith-6vcpu-macos-26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - name: cargo check
        run: |
          rm -f Cargo.lock
          cargo +nightly check -Z minimal-versions \
            --workspace --all-features --lib --bins

  minimal-crates-windows:
    timeout-minutes: 30
    name: "Minimal Crates (Windows)"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: [windows-latest]
        target:
          - x86_64-pc-windows-msvc
        include:
          - name: windows-latest
            os: windows
            runner: blacksmith-8vcpu-windows-2025
    env:
      # sccache backend is selected at runtime in "Configure sccache backend":
      # local disk on self-hosted, GHA-backed on Blacksmith (ephemeral).
      RUSTC_WRAPPER: "sccache"
      # We avoid `rustup default` as that would rewrite the default o
      # the shared self-hosted runner. This only affects steps which
      # do not explicitly pass `+nightly`.
      RUSTUP_TOOLCHAIN: "nightly"
    steps:
      - name: Configure Git Bash
        shell: pwsh
        run: |
          $gitBashDir = "$env:ProgramFiles\Git\bin"
          if (-not (Test-Path "$gitBashDir\bash.exe")) {
            throw "Git Bash not found at $gitBashDir\bash.exe"
          }
          $gitBashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --target "${{ matrix.target }}"
          rustup set default-host "${{ matrix.target }}"
          rustc --version

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
        with:
          # Pinned: sccache >= 0.17.0 expands rustc @argfiles and breaks Windows'
          # 32K command line limit: https://github.com/mozilla/sccache/issues/2397
          version: "v0.16.0"
      - uses: $/.github/workflows/sccache-probe

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          # Blacksmith's Windows image ships no pre-installed MSYS2 (C:\msys64),
          # so install it there. Self-hosted keeps the pre-installed one (faster).
          release: ${{ startsWith(runner.name, 'blacksmith-') }}

      - name: Install aws-lc-sys build dependencies
        shell: powershell
        run: |
          $chocoPath = "$Env:ProgramData\chocolatey\bin\choco.exe"
          if (!(Test-Path $chocoPath)) {
            $chocoPath = "$Env:SystemDrive\ProgramData\chocolatey\bin\choco.exe"
          }
          & $chocoPath install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          & $chocoPath install nasm -y
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NASM" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

      - name: cargo check
        # No --locked: re-resolving is the point, so -Z min-publish-age guards
        # the versions the lockfile has never seen.
        run: |
          rm -Force Cargo.lock
          cargo +nightly check -Z minimal-versions `
            --workspace --all-features --lib --bins
