# Advisories, yanked releases, licenses and git sources, per the caller's
# deny.toml. Warnings fail the job, so stale ignores fail too.

name: cargo deny

on:
  workflow_call:
    inputs:
      arguments:
        description: Arguments passed to cargo-deny before the command.
        type: string
        default: "--workspace --all-features"

permissions:
  contents: read

jobs:
  cargo-deny:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: ${{ inputs.arguments }}
          command: check
          command-arguments: "-Dwarnings"
