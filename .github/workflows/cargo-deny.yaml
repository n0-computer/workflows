# Run cargo-deny on pull requests.
#
# This workflow is meant to run on every PR.  New advisories do not
# fail the job, cargo-deny-advisories.yaml is used to check those when
# dependencies change and periodically.
#
# Usage, re-using triggers from the calling workflow:
#
#   jobs:
#     cargo-deny:
#       name: Cargo Deny
#       uses: "n0-computer/workflows/.github/workflows/cargo-deny.yaml@tag"

name: Cargo Deny

on:
  workflow_call:

concurrency:
  group: cargo-deny-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  cargo-deny:
    timeout-minutes: 30
    name: cargo deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Prevent sudden announcement of a new advisory from failing CI.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: "--workspace --all-features"
          command: check ${{ matrix.checks }}
          command-arguments: "-Dwarnings"
